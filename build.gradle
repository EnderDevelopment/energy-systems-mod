plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extensions {
    loom {
        minecraftVersion = '1.21.4'
        mappingsNamespace = 'intermediary'
        accessWidener = 'src/main/resources/accessWidener.txt'
        modSourceSets {
            main {
                resources {
                    srcDir 'src/main/resources'
                }
            }
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:intermediary:1.21.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.96.1+1.21.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', loom.minecraftVersion
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand([project: project])
    }
    into "build/resources/main"
}